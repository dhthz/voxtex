[project]
name = "voxtex"
version = "0.0.1"
description = "Talk into your LaTeX project: voice in, clean academic LaTeX out, in your own template."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "bibtexparser>=1.4,<2",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]

[project.scripts]
voxtex = "voxtex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxtex"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/voxtex/engine/prompts.py" = ["E501"]  # prompt text reads better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
