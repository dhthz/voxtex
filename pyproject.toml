[project]
name = "voxtex"
version = "0.1.0"
description = "Talk to your thesis, get LaTeX that compiles: a voice editor for LaTeX in Greek and English."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dhthz" }]
keywords = ["latex", "dictation", "speech-to-text", "whisper", "thesis", "voice", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: Greek",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "tomli-w>=1.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "bibtexparser>=1.4,<2",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "webrtcvad-wheels>=2.0.14",
    "watchdog>=6.0.0",
    "faster-whisper>=1.0",
    "textual>=1.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# CUDA libraries for faster-whisper on NVIDIA GPUs (Linux/WSL/Windows).
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]

[project.urls]
Homepage = "https://github.com/dhthz/voxtex"
Issues = "https://github.com/dhthz/voxtex/issues"

[project.scripts]
voxtex = "voxtex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxtex"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/voxtex/engine/prompts.py" = ["E501"]  # prompt text reads better unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
